<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rest Your Brain - Number Puzzle</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .game {
            width: 390px;
            max-width: 100%;
            padding: 28px;
            text-align: center;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .brain {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            color: #1f2937;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 22px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f3f4f6;
            padding: 12px 5px;
            border-radius: 12px;
        }

        .stat-title {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #111827;
        }

        .puzzle {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 20px;
        }

        .number {
            height: 82px;
            border: none;
            border-radius: 15px;

            background: linear-gradient(135deg, #4f46e5, #6366f1);

            color: white;
            font-size: 27px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 10px rgba(79, 70, 229, 0.25);

            transition:
                transform 0.15s,
                box-shadow 0.15s,
                background 0.2s;
        }

        .number:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(79, 70, 229, 0.35);
        }

        .number:active {
            transform: scale(0.94);
        }

        .empty {
            background: #e5e7eb;
            box-shadow: none;
            cursor: default;
        }

        .empty:hover {
            transform: none;
            box-shadow: none;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .game-btn {
            flex: 1;
            border: none;
            padding: 13px 10px;
            border-radius: 12px;

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s;
        }

        .game-btn:hover {
            transform: translateY(-2px);
        }

        #restart {
            background: #111827;
        }

        #themeBtn {
            background: #4f46e5;
        }

        #message {
            min-height: 28px;
            margin-top: 18px;

            font-size: 17px;
            font-weight: bold;
            color: #16a34a;
        }

        .best {
            margin-top: 5px;
            font-size: 13px;
            color: #6b7280;
        }

        /* Dark Mode */

        body.dark {
            background: linear-gradient(135deg, #111827, #312e81);
        }

        body.dark .game {
            background: #1f2937;
        }

        body.dark h1 {
            color: white;
        }

        body.dark .subtitle,
        body.dark .best {
            color: #9ca3af;
        }

        body.dark .stat {
            background: #374151;
        }

        body.dark .stat-title {
            color: #d1d5db;
        }

        body.dark .stat-value {
            color: white;
        }

        body.dark .empty {
            background: #374151;
        }

        /* Mobile */

        @media (max-width: 420px) {

            .game {
                padding: 22px;
            }

            .brain {
                font-size: 45px;
            }

            h1 {
                font-size: 25px;
            }

            .number {
                height: 70px;
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <div class="brain">🧠</div>

        <h1>Rest Your Brain</h1>

        <p class="subtitle">
            Arrange numbers from 1 to 8
        </p>


        <!-- Game Statistics -->

        <div class="stats">

            <div class="stat">
                <span class="stat-title">Moves</span>
                <span class="stat-value" id="moves">0</span>
            </div>

            <div class="stat">
                <span class="stat-title">Time</span>
                <span class="stat-value">
                    <span id="time">0</span>s
                </span>
            </div>

            <div class="stat">
                <span class="stat-title">Best</span>
                <span class="stat-value" id="best">-</span>
            </div>

        </div>


        <!-- Puzzle -->

        <div class="puzzle" id="puzzle"></div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="game-btn"
                id="restart"
                onclick="startGame()">
                🔄 New Game
            </button>

            <button
                class="game-btn"
                id="themeBtn"
                onclick="toggleTheme()">
                🌙 Theme
            </button>

        </div>


        <p id="message"></p>

        <p class="best">
            Solve the puzzle with minimum moves!
        </p>

    </div>


    <script>

        let numbers = [];

        let moves = 0;

        let seconds = 0;

        let timer;

        let gameStarted = false;


        // -------------------------
        // Start Game
        // -------------------------

        function startGame() {

            clearInterval(timer);

            moves = 0;

            seconds = 0;

            gameStarted = false;


            document.getElementById("moves").textContent = moves;

            document.getElementById("time").textContent = seconds;

            document.getElementById("message").textContent = "";


            /*
                Start from solved puzzle
                and make valid random moves.
                This guarantees a solvable puzzle.
            */

            numbers = [1, 2, 3, 4, 5, 6, 7, 8, 0];


            let previousEmpty = -1;

            let shuffleMoves = 100;


            for (let i = 0; i < shuffleMoves; i++) {

                let emptyIndex = numbers.indexOf(0);

                let possibleMoves = getPossibleMoves(emptyIndex);


                // Avoid immediately reversing previous move

                if (previousEmpty !== -1 && possibleMoves.length > 1) {

                    possibleMoves =
                        possibleMoves.filter(
                            index => index !== previousEmpty
                        );
                }


                let randomIndex =
                    possibleMoves[
                        Math.floor(
                            Math.random() * possibleMoves.length
                        )
                    ];


                [numbers[randomIndex], numbers[emptyIndex]] =
                [numbers[emptyIndex], numbers[randomIndex]];


                previousEmpty = emptyIndex;
            }


            drawPuzzle();


            // Start timer

            timer = setInterval(function () {

                seconds++;

                document.getElementById("time").textContent =
                    seconds;

            }, 1000);
        }


        // -------------------------
        // Get possible moves
        // -------------------------

        function getPossibleMoves(emptyIndex) {

            let movesList = [];

            let row = Math.floor(emptyIndex / 3);

            let col = emptyIndex % 3;


            // Up

            if (row > 0) {

                movesList.push(emptyIndex - 3);

            }


            // Down

            if (row < 2) {

                movesList.push(emptyIndex + 3);

            }


            // Left

            if (col > 0) {

                movesList.push(emptyIndex - 1);

            }


            // Right

            if (col < 2) {

                movesList.push(emptyIndex + 1);

            }


            return movesList;
        }


        // -------------------------
        // Draw Puzzle
        // -------------------------

        function drawPuzzle() {

            const puzzle =
                document.getElementById("puzzle");


            puzzle.innerHTML = "";


            numbers.forEach(function (number, index) {

                const button =
                    document.createElement("button");


                button.classList.add("number");


                if (number === 0) {

                    button.classList.add("empty");

                    button.textContent = "";

                }

                else {

                    button.textContent = number;


                    button.onclick = function () {

                        moveNumber(index);

                    };

                }


                puzzle.appendChild(button);

            });
        }


        // -------------------------
        // Move Number
        // -------------------------

        function moveNumber(index) {

            const emptyIndex =
                numbers.indexOf(0);


            const possibleMoves =
                getPossibleMoves(emptyIndex);


            if (possibleMoves.includes(index)) {


                [numbers[index], numbers[emptyIndex]] =
                [numbers[emptyIndex], numbers[index]];


                moves++;


                document.getElementById("moves").textContent =
                    moves;


                gameStarted = true;


                drawPuzzle();


                checkWin();
            }
        }


        // -------------------------
        // Check Win
        // -------------------------

        function checkWin() {

            const winningOrder =
                [1, 2, 3, 4, 5, 6, 7, 8, 0];


            const won =
                numbers.every(function (number, index) {

                    return number === winningOrder[index];

                });


            if (won) {

                clearInterval(timer);


                document.getElementById("message").textContent =
                    "🎉 You Win! Great Brain!";


                saveBestScore();

            }
        }


        // -------------------------
        // Best Score
        // -------------------------

        function saveBestScore() {

            let oldBest =
                localStorage.getItem("restYourBrainBest");


            if (
                oldBest === null ||
                seconds < Number(oldBest)
            ) {

                localStorage.setItem(
                    "restYourBrainBest",
                    seconds
                );

            }


            showBestScore();
        }


        function showBestScore() {

            let best =
                localStorage.getItem("restYourBrainBest");


            if (best !== null) {

                document.getElementById("best").textContent =
                    best + "s";

            }

        }


        // -------------------------
        // Dark Mode
        // -------------------------

        function toggleTheme() {

            document.body.classList.toggle("dark");


            if (document.body.classList.contains("dark")) {

                localStorage.setItem(
                    "restYourBrainTheme",
                    "dark"
                );

            }

            else {

                localStorage.setItem(
                    "restYourBrainTheme",
                    "light"
                );

            }

        }


        // -------------------------
        // Load Theme
        // -------------------------

        function loadTheme() {

            let theme =
                localStorage.getItem("restYourBrainTheme");


            if (theme === "dark") {

                document.body.classList.add("dark");

            }

        }


        // -------------------------
        // Page Load
        // -------------------------

        loadTheme();

        showBestScore();

        startGame();

    </script>

</body>
</html>
